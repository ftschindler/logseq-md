---
dirs:
- .
fileExtensions:
- md
useGitIgnore: true
excludedDirs:
# Graph fixtures carry whatever links a real page carries, including dead ones,
# because that is what they are testing the parser against.
- ./tests/fixtures
ignorePatterns:
- pattern: '^mailto:'
aliveStatusCodes:
- 200
- 206
- 429  # rate-limited, but the target exists
# 504 is what GitHub returns to a headless browser it has decided to throttle,
# which is most of this file's links run from a CI runner. A link that is
# genuinely gone comes back 404, so treating a gateway timeout as alive gives up
# very little and is the difference between a deterministic check and one that
# fails on eight live links at once. Seen doing exactly that: run 42582463832.
- 504
timeout: 15000
retryCount: 5
