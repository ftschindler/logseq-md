---
name: Governance

permissions:
  contents: read

# Pull requests only, and deliberately: GitHub builds a pull request's checks
# against the head merged into `main`, so what this runs on is already the merge
# result. `workflow_dispatch` remains for asking `main` the question by hand.
#
# What this gives up is the case where two pull requests pass separately and
# conflict in meaning once both are in. Closing that needs the branch to be up
# to date before merging, which is a repository setting rather than anything
# here.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: governance_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  governance:
    name: 🩺 (run governance checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -elo pipefail {0}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup node
      # The link checker drives a headless browser, which is a node toolchain.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "24"

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        cache-dependency-glob: |
          pyproject.toml
          .scripts/*.py

    # The suite includes ruff over every Python file and `ty` over `src/` and
    # `tests/`, so the type check is one hook rather than a second job: a
    # contributor who runs `make check` gets the same answer CI does, which is
    # the property worth having.
    #
    # It also covers every link in the tree. `linkspector-changed` is handed the
    # changed files on the commit path and every file here, which is the whole
    # sweep already: a separate `linkspector-all` step would drive the same
    # browser over the same URLs a second time, double the runtime and double
    # the chance of a throttled link failing the job.
    - name: Run pre-commit hooks
      run: uvx prek run --show-diff-on-failure --color=always --all-files
